<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>中国共产主义学习会直属网站</title>
    <!-- ===== 增强版 CSS ===== -->
    <style>
        /* ---------- 全局重置 & 变量 ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
        }

        :root {
            --main-red: #c41e3a;
            --main-gold: #d4af37;
            --main-blue: #0a2463;
            --main-blue-light: #1a3a7a;
            --light-bg: #f0f2f8;
            --text-dark: #1e1e2f;
            --shadow-sm: 0 4px 20px rgba(10, 36, 99, 0.10);
            --shadow-md: 0 12px 40px rgba(10, 36, 99, 0.18);
            --shadow-lg: 0 20px 60px rgba(10, 36, 99, 0.25);
            --radius: 16px;
            --transition: 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: var(--light-bg);
            color: var(--text-dark);
            opacity: 0;
            transform: translateY(28px);
            animation: pageFadeIn 0.9s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        @keyframes pageFadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(10, 36, 99, 0.06);
            border-radius: 8px;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--main-gold);
            border-radius: 8px;
        }

        /* ---------- 导航栏 (毛玻璃效果) ---------- */
        header {
            position: sticky;
            top: 0;
            z-index: 999;
            background: rgba(10, 36, 99, 0.82);
            backdrop-filter: blur(14px) saturate(180%);
            -webkit-backdrop-filter: blur(14px) saturate(180%);
            border-bottom: 1px solid rgba(212, 175, 55, 0.20);
            transition: background 0.4s ease, box-shadow 0.4s ease;
            box-shadow: 0 2px 24px rgba(0, 0, 0, 0.15);
        }
        header.scrolled {
            background: rgba(10, 36, 99, 0.94);
            box-shadow: 0 4px 32px rgba(0, 0, 0, 0.30);
        }

        .nav-container {
            max-width: 1300px;
            margin: 0 auto;
            height: 74px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 32px;
        }

        .site-logo {
            display: flex;
            align-items: center;
            gap: 14px;
            text-decoration: none;
        }
        .site-logo img {
            height: 48px;
            width: 48px;
            border-radius: 50%;
            border: 2px solid var(--main-gold);
            object-fit: cover;
            transition: transform 0.5s ease;
        }
        .site-logo:hover img {
            transform: rotate(-6deg) scale(1.04);
        }
        .site-logo h1 {
            color: #fff;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 1.5px;
            background: linear-gradient(135deg, var(--main-gold), #f5e18b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .nav-menu {
            display: flex;
            gap: 36px;
            align-items: center;
        }
        .nav-menu a {
            color: rgba(255, 255, 255, 0.80);
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            position: relative;
            padding: 6px 0;
            transition: color 0.3s ease;
        }
        /* 下划线动画 */
        .nav-menu a::after {
            content: '';
            position: absolute;
            left: 50%;
            bottom: -2px;
            width: 0%;
            height: 2.5px;
            background: linear-gradient(90deg, var(--main-gold), #f5e18b);
            border-radius: 4px;
            transition: width 0.4s cubic-bezier(0.22, 1, 0.36, 1), left 0.4s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .nav-menu a:hover {
            color: #fff;
        }
        .nav-menu a:hover::after {
            width: 100%;
            left: 0%;
        }

        /* ---------- 轮播横幅 ---------- */
        .banner-wrap {
            width: 100%;
            height: 460px;
            overflow: hidden;
            position: relative;
            border-radius: 0 0 32px 32px;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.18);
        }

        .slide-box {
            width: 200%;
            height: 100%;
            display: flex;
            transition: transform 0.85s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        .slide-item {
            width: 50%;
            height: 100%;
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
        }
        .slide-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 6s ease;
        }
        .slide-item:hover img {
            transform: scale(1.06);
        }
        /* 图片上的渐变遮罩 */
        .slide-item::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(10, 36, 99, 0.20) 0%, transparent 60%);
            pointer-events: none;
        }

        /* 轮播按钮 */
        .slide-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 50px;
            height: 50px;
            border: none;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.20);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            font-size: 22px;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        .slide-btn:hover {
            background: rgba(255, 255, 255, 0.40);
            transform: translateY(-50%) scale(1.10);
        }
        .slide-btn:active {
            transform: translateY(-50%) scale(0.92);
        }
        .prev-btn {
            left: 24px;
        }
        .next-btn {
            right: 24px;
        }

        /* 指示器 */
        .indicators {
            position: absolute;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 14px;
            z-index: 10;
        }
        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.35);
            border: 2px solid rgba(255, 255, 255, 0.25);
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }
        .dot.active {
            background: var(--main-gold);
            border-color: var(--main-gold);
            transform: scale(1.25);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.50);
        }
        .dot:hover {
            transform: scale(1.15);
            background: rgba(255, 255, 255, 0.60);
        }

        /* ---------- 主体双栏 ---------- */
        .main-content {
            max-width: 1300px;
            margin: 60px auto;
            padding: 0 32px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 48px;
        }

        /* 卡片模块 */
        .module-card {
            background: #ffffff;
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            padding: 36px 32px 40px;
            transition: all 0.45s cubic-bezier(0.22, 1, 0.36, 1);
            border: 1px solid rgba(212, 175, 55, 0.08);
            position: relative;
            overflow: hidden;
            transform: translateY(0);
        }
        /* 卡片顶部装饰线 */
        .module-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--main-blue), var(--main-gold), var(--main-red));
            background-size: 200% 100%;
            animation: shimmerBorder 4s ease-in-out infinite;
        }
        @keyframes shimmerBorder {
            0%,
            100% {
                background-position: 0% 0%;
            }
            50% {
                background-position: 100% 0%;
            }
        }

        .module-card:hover {
            box-shadow: var(--shadow-md);
            transform: translateY(-6px);
            border-color: rgba(212, 175, 55, 0.20);
        }

        .module-title {
            text-align: center;
            font-size: 24px;
            font-weight: 700;
            color: var(--main-blue);
            margin-bottom: 28px;
            padding-bottom: 14px;
            position: relative;
            letter-spacing: 1px;
        }
        .module-title::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 3.5px;
            border-radius: 4px;
            background: linear-gradient(90deg, var(--main-gold), var(--main-red));
            transition: width 0.6s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .module-card:hover .module-title::after {
            width: 100px;
        }

        /* ---------- 留言板块 ---------- */
        .message-list {
            height: 250px;
            overflow-y: auto;
            border: 1px solid #e8ec
